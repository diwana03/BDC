name: Apply Finalist Couple Name and Flag Layout v654
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/apply-final-couple-name-flag-v654.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Apply guarded finalist couple identity fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          feed = Path('live-display/feed.php')
          s = feed.read_text()

          old = '''<div style="display:flex;flex-direction:column;align-items:center;min-width:0;max-width:44%"><img class="photo" src="<?= e($displayPhoto) ?>" onerror="this.onerror=null;this.src='<?= e($fallbackPhoto) ?>'" style="margin-bottom:.25em"><div class="name" style="font-size:.86em"><?= e($person["name"] ?: "Partner pending") ?></div><div class="small">BIB <?= !empty($person["bib"]) ? (int) $person["bib"] : "—" ?></div><?php if (!empty($person["country"])): ?><div class="small flight-country"><?php if ($flagUrl = country_flag_url($person["country"])): ?><img src="<?= e($flagUrl) ?>" alt="<?= e($person["country"]) ?> flag" style="width:clamp(30px,2.25vw,56px);height:clamp(20px,1.5vw,37px);object-fit:cover;border:1px solid rgba(255,255,255,.7);border-radius:4px"><?php endif; ?><?= e($person["country"]) ?></div><?php endif; ?></div>'''
          new = '''<div class="couple-person"><img class="photo" src="<?= e($displayPhoto) ?>" onerror="this.onerror=null;this.src='<?= e($fallbackPhoto) ?>'" style="margin-bottom:.25em"><div class="couple-person-identity"><div class="name couple-person-name"><?= e(ProjectionNameService::firstName((string)($person["name"] ?: "Partner pending"))) ?></div><?php if (!empty($person["country"]) && ($flagUrl = country_flag_url($person["country"])): ?><img class="couple-person-flag" src="<?= e($flagUrl) ?>" alt="<?= e($person["country"]) ?> flag"><?php endif; ?></div><div class="small couple-person-bib">BIB <?= !empty($person["bib"]) ? (int) $person["bib"] : "—" ?></div></div>'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'finalist couple markup: expected 1 match, found {n}')
          s = s.replace(old, new, 1)

          old_css = '.list .item>div:nth-child(2)>div{max-width:48%;padding-bottom:clamp(6px,.55vh,12px)}.list .item>div:nth-child(2)>div>.name{font-size:clamp(11px,.92vw,22px)}.list .item>div:nth-child(2)>div>div:nth-of-type(2){font-size:clamp(19px,1.55vw,38px);font-weight:950;line-height:1;color:#fff;margin:.04em 0}'
          new_css = '.list .item>div:nth-child(2)>.couple-person{max-width:48%;padding-bottom:clamp(6px,.55vh,12px);display:flex;flex-direction:column;align-items:center;min-width:0}.couple-person-identity{width:100%;min-width:0;display:flex;align-items:center;justify-content:center;gap:clamp(5px,.42vw,10px);white-space:nowrap;overflow:hidden}.couple-person-name{min-width:0;max-width:calc(100% - clamp(26px,1.8vw,42px));font-size:clamp(15px,1.18vw,28px)!important;font-weight:950;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.couple-person-flag{flex:0 0 auto;width:clamp(26px,1.8vw,42px);height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid rgba(255,255,255,.78);border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.28)}.couple-person-bib{font-size:clamp(19px,1.55vw,38px)!important;font-weight:950;line-height:1;color:#fff;margin:.08em 0 0}'
          n = s.count(old_css)
          if n != 1:
              raise SystemExit(f'finalist couple css: expected 1 match, found {n}')
          s = s.replace(old_css, new_css, 1)
          feed.write_text(s)

          version = Path('VERSION.json')
          data = json.loads(version.read_text())
          if data.get('version') != '2.3.3-dev653' or data.get('build') != 3359:
              raise SystemExit(f'Unexpected VERSION.json {data.get("version")} build {data.get("build")}')
          data['version'] = '2.3.3-dev654'
          data['build'] = 3360
          data['release_date'] = '2026-09-06'
          data.setdefault('features', []).insert(0, 'Finalist Couples and shared couple projector cards now show first name only with a larger country flag immediately after the name, remove the country-name row entirely, and preserve BIB, photos and the responsive five-couple grid.')
          version.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          Path('tests/final-couple-name-flag-v654.php').write_text(r'''<?php
          declare(strict_types=1);
          $feed=file_get_contents(__DIR__.'/../live-display/feed.php');
          if(!str_contains($feed,'ProjectionNameService::firstName((string)($person["name"] ?: "Partner pending"))'))throw new RuntimeException('Final couple first-name rendering missing');
          if(!str_contains($feed,'class="couple-person-flag"'))throw new RuntimeException('Inline couple flag missing');
          if(!str_contains($feed,'font-size:clamp(15px,1.18vw,28px)!important'))throw new RuntimeException('Larger couple name missing');
          if(!str_contains($feed,'width:clamp(26px,1.8vw,42px)'))throw new RuntimeException('Larger couple flag missing');
          if(str_contains($feed,'?><?= e($person["country"]) ?></div><?php endif; ?></div>'))throw new RuntimeException('Country text row still present in couple card');
          if(!str_contains($feed,'$coupleColumns = 5;'))throw new RuntimeException('Five-column responsive couple grid changed');
          echo "final couple name flag v654: PASS\n";
          ''')

          Path('RELEASE-v2.3.3-dev654.md').write_text('''# BDC v2.3.3-dev654 — Finalist couple name and flag layout\n\nBuild 3360\n\n## Changes\n\n- Finalist Couples now show first name only for each dancer.\n- Places the country flag immediately after the dancer name on the same centered line.\n- Removes the country-name row completely.\n- Makes both dancer names and flags larger and easier to read on the 16:9 projection.\n- Keeps names single-line with responsive ellipsis protection.\n- Preserves photos, BIBs, couple numbering, matching data and the existing five-couple responsive grid.\n\n## Validation\n\n- PHP 8.1 syntax check.\n- Focused regression assertions for first-name rendering, inline larger flags, no country text row, BIB preservation and unchanged five-column grid.\n''')
          PY
          php -l live-display/feed.php
          php tests/final-couple-name-flag-v654.php
          git diff --check
      - name: Commit verified release and remove temporary workflow
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-final-couple-name-flag-v654.yml
          git add live-display/feed.php tests/final-couple-name-flag-v654.php VERSION.json RELEASE-v2.3.3-dev654.md
          git diff --cached --check
          git commit -m 'Release dev654 finalist couple name and flag layout'
          git push origin HEAD:develop
