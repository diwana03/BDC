name: Release dev676 Projection Header Spacing
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev676-projection-header-spacing.yml'
permissions:
  contents: write
concurrency:
  group: release-dev676-projection-header-spacing
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev676 projection header spacing
        run: bash .github/scripts/release-dev676-projection-header-spacing.sh
