name: Apply dev84 scoring test mode patch

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch-dev84.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch Scoring Tests index directly
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path('admin/scoring-tests/index.php')
          s = path.read_text()

          anchor = "$userId=(int)(Auth::user()['id']??0);\n$error=''; $notice='';\n"
          replacement = "$userId=(int)(Auth::user()['id']??0);\n$error=''; $notice='';\n\n$testMode=(string)($_GET['test_mode']??$_POST['test_mode']??$_SESSION['bdc_test_scoring_mode']??'manual');\nif(!in_array($testMode,['manual','automated'],true))$testMode='manual';\n$_SESSION['bdc_test_scoring_mode']=$testMode;\n$isAutomaticTest=$testMode==='automated';\n"
          if '$isAutomaticTest=' not in s:
              if anchor not in s:
                  raise SystemExit('top mode anchor not found')
              s = s.replace(anchor, replacement, 1)

          old_header = '<div class="text-muted">Manual Scoring Engine · Event Round Workflow</div>'
          new_header = '<div class="text-muted"><?= $isAutomaticTest ? \'Automatic Scoring Engine\' : \'Manual Scoring Engine\' ?> · Event Round Workflow</div>'
          if old_header in s:
              s = s.replace(old_header, new_header, 1)

          old_h1 = '<h1 class="h3 mb-1">Scoring Tests Dashboard</h1>'
          new_h1 = '<h1 class="h3 mb-1">Scoring Tests Dashboard <span class="badge <?= $isAutomaticTest ? \'text-bg-primary\' : \'text-bg-dark\' ?>" style="font-size:.72rem"><?= $isAutomaticTest ? \'AUTOMATIC TEST\' : \'MANUAL TEST\' ?></span></h1>'
          if old_h1 in s:
              s = s.replace(old_h1, new_h1, 1)

          start = '<form method="post" id="heatsScoreForm" data-callback-count="<?=(int)$round[\'callback_count\']?>">'
          if start not in s:
              raise SystemExit('heatsScoreForm start not found')
          start_i = s.index(start)
          end_marker = '</div></form>\n\n<?php if(in_array($round[\'status\'],[\'awaiting_decision\',\'scores_submitted\'],true)):?>'
          end_i = s.index(end_marker, start_i)
          manual_block = s[start_i:end_i + len('</div></form>')]
          if '<?php if($isAutomaticTest):?>' not in manual_block:
              auto_block = '''<?php if($isAutomaticTest):?>
<?php
 $_GET['round_id']=$roundId;
 $_GET['test_mode']='automated';
 require __DIR__.'/automatic-inline.php';
?>
<?php else:?>
''' + manual_block + '''
<?php endif;?>'''
              s = s[:start_i] + auto_block + s[end_i + len('</div></form>'):]

          old_open = '<a class="btn btn-sm btn-outline-dark" href="?round_id=<?=$r[\'id\']?>">Open</a>'
          new_open = '<a class="btn btn-sm btn-outline-dark" href="?round_id=<?=$r[\'id\']?>&amp;test_mode=<?=e($testMode)?>">Open</a>'
          s = s.replace(old_open, new_open)

          path.write_text(s)

          auto = Path('admin/scoring-tests/automatic-inline.php')
          a = auto.read_text()
          a = a.replace("$redirect=url('admin/scoring-tests/workspace.php?test_mode='.$mode.'&round_id='.$roundId);", "$redirect=url('admin/scoring-tests/index.php?legacy=1&test_mode='.$mode.'&round_id='.$roundId);")
          auto.write_text(a)

          version = Path('VERSION.json')
          v = json.loads(version.read_text())
          v['version'] = '2.3.3-dev84'
          v['build'] = 2414
          v['release_date'] = '2026-08-09'
          v['features'] = [
            'Makes Manual versus Automatic Scoring Tests a native server-side branch inside the established index.php dashboard',
            'Automatic Test can no longer render the Manual Heats Score Entry form',
            'Automatic mode renders Judge Live Scoring directly in the same score-entry position using TestAutomaticJudgeService',
            'Manual mode keeps the established manual score-entry table unchanged',
            'Keeps the same event, round, tier, judge, leader and follower dashboard layout in both modes',
            'Preserves the selected test mode when opening saved rounds',
            'Keeps secure judge URLs, live progress and submitted-session locking',
            'No Staging or Production deployment performed'
          ]
          version.write_text(json.dumps(v, indent=2) + '\n')

      - name: Commit direct patch
        run: |
          git config user.name "BDC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin/scoring-tests/index.php admin/scoring-tests/automatic-inline.php VERSION.json
          git rm .github/workflows/patch-dev84.yml
          git commit -m "fix(scoring-tests): render automatic mode natively in dashboard" || exit 0
          git push origin develop
