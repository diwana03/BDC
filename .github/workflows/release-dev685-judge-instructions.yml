name: Release dev685 Judge Instructions
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev685-judge-instructions.yml'
permissions:
  contents: write
concurrency:
  group: release-dev685-judge-instructions
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev685 clean judge instructions
        run: bash .github/scripts/release-dev685-judge-instructions.sh
