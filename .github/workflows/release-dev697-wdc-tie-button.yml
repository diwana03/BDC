name: Release dev697 WDC Tie Button
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev697-wdc-tie-button.yml'
permissions:
  contents: write
concurrency:
  group: release-dev697-wdc-tie-button
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Repair Chief Judge tie button markup
        run: bash .github/scripts/release-dev697-wdc-tie-button.sh
      # rerun after removing fragile inline JavaScript
