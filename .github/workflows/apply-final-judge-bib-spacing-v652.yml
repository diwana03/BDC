name: Apply Final Judge Label and Couple Bib Spacing v652
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/apply-final-judge-bib-spacing-v652.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Apply guarded projector enhancements
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def one(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old,new,1))

          feed='live-display/feed.php'
          one(feed,
              '$scopeLabel=$scope==="leader"?"JUDGING LEADERS":($scope==="follower"?"JUDGING FOLLOWERS":"JUDGING LEADERS & FOLLOWERS");',
              '$scopeLabel=(string)$r["round_type"]==="final"?"JUDGING ALL COUPLES":($scope==="leader"?"JUDGING LEADERS":($scope==="follower"?"JUDGING FOLLOWERS":"JUDGING LEADERS & FOLLOWERS"));',
              'final-only judge wording')

          one(feed,
              '.list .item>div:nth-child(2)>div{max-width:48%}',
              '.list .item>div:nth-child(2)>div{max-width:48%;padding-bottom:clamp(6px,.55vh,12px)}',
              'couple bib bottom breathing room')

          Path('tests/final-projector-polish-v652.php').write_text(r'''<?php
          declare(strict_types=1);
          $feed=file_get_contents(__DIR__.'/../live-display/feed.php');
          if(!str_contains($feed,'(string)$r["round_type"]==="final"?"JUDGING ALL COUPLES"'))throw new RuntimeException('Final judge label missing');
          if(!str_contains($feed,'"JUDGING LEADERS":($scope==="follower"?"JUDGING FOLLOWERS":"JUDGING LEADERS & FOLLOWERS")'))throw new RuntimeException('Heats judge wording changed');
          if(!str_contains($feed,'padding-bottom:clamp(6px,.55vh,12px)'))throw new RuntimeException('Couple bottom spacing missing');
          if(!str_contains($feed,'$coupleColumns = 5;'))throw new RuntimeException('Responsive five-card couple grid changed');
          if(!str_contains($feed,'BDC · Official Live Display'))throw new RuntimeException('Official live badge changed');
          if(!str_contains($feed,"public/assets/bdc-logo.png"))throw new RuntimeException('BDC logo changed');
          echo "final projector polish v652: PASS\n";
          ''')

          version=Path('VERSION.json'); data=json.loads(version.read_text())
          if data.get('version')!='2.3.3-dev651' or data.get('build')!=3357:
              raise SystemExit(f'Unexpected VERSION.json {data.get("version")} build {data.get("build")}')
          data['version']='2.3.3-dev652'; data['build']=3358; data['release_date']='2026-09-06'
          data.setdefault('features',[]).insert(0,'Adds safe breathing room below each dancer identity in Finalist Couples and Emcee Random Final Match so BIBs never sit on the card edge, and changes only Final judge presentation wording to JUDGING ALL COUPLES while preserving all Heats judge scope wording and logic, the existing BDC logo, and the BDC Official Live Display badge.')
          version.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          Path('RELEASE-v2.3.3-dev652.md').write_text('''# BDC v2.3.3-dev652 — Final projector polish\n\nBuild 3358\n\n## Changes\n\n- Adds bottom breathing room inside every Finalist Couples and Emcee Random Final Match dancer identity so the BIB line stays visibly clear of the card edge.\n- On Final rounds only, judge scope is presented as `JUDGING ALL COUPLES`.\n- Heats wording remains exactly `JUDGING LEADERS`, `JUDGING FOLLOWERS`, or `JUDGING LEADERS & FOLLOWERS` according to the existing scoring scope.\n- Does not change scoring assignments, matching, pair generation, five-card responsive grid logic, BDC logo, or `BDC · Official Live Display` badge.\n\n## Validation\n\n- PHP 8.1 syntax check on the projector feed.\n- Focused regression checks Final-only wording, unchanged Heats wording, BIB bottom spacing, five-card grid, logo and official badge.\n''')
          PY
          php -l live-display/feed.php
          php tests/final-projector-polish-v652.php
          git diff --check
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-final-judge-bib-spacing-v652.yml
          git add live-display/feed.php tests/final-projector-polish-v652.php VERSION.json RELEASE-v2.3.3-dev652.md
          git diff --cached --check
          git commit -m 'Release dev652 final projector polish'
          git push origin HEAD:develop
