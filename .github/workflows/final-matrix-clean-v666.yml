name: Final Matrix Clean v666
on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/final-matrix-clean-v666.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Preserve Final flags and clean matrix sizing
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php'); s=p.read_text()
          legacy="cells[1].textContent=cells[1].textContent.replace(/^#(\\d+)\\s*/,'#P$1 · ');"
          if legacy not in s: raise SystemExit('legacy Final cell text rewrite missing')
          s=s.replace(legacy,'',1)
          anchor='.matrix-final td:nth-child(n+3){font-size:1.12em;font-weight:950}'
          css='''.matrix-final{font-size:clamp(13px,.9vw,21px)!important}\n.matrix-final th:first-child,.matrix-final td:first-child{width:12%!important;font-size:clamp(12px,.82vw,19px)!important}\n.matrix-final th:nth-child(2),.matrix-final td:nth-child(2){width:44%!important;font-size:clamp(16px,1.05vw,25px)!important;padding-left:.45em!important;overflow:hidden}\n.matrix-final th:nth-child(n+3){font-size:clamp(8px,.5vw,12px)!important}.matrix-final th:nth-child(n+3) small{font-size:.72em!important}\n.matrix-final td:nth-child(n+3){font-size:clamp(12px,.8vw,19px)!important;font-weight:950}\n.matrix-final .final-matrix-couple{display:flex!important;align-items:center;gap:clamp(6px,.42vw,10px);min-width:0;width:100%;white-space:nowrap;overflow:hidden}\n.matrix-final .final-matrix-person{display:flex!important;align-items:center;gap:clamp(5px,.34vw,8px);min-width:0;white-space:nowrap;overflow:hidden}\n.matrix-final .final-matrix-person>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.matrix-final .final-matrix-person strong{flex:0 0 auto;font-size:.86em}\n.matrix-final .final-matrix-flag{flex:0 0 auto;width:clamp(24px,1.45vw,35px);height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid rgba(255,255,255,.72);border-radius:2px}\n.matrix-final .final-matrix-amp{flex:0 0 auto;font-weight:950;color:#f4e7c1}'''
          if css not in s:
              if anchor not in s: raise SystemExit('Final CSS anchor missing')
              s=s.replace(anchor,anchor+'\n'+css,1)
          p.write_text(s)
          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev665' or d.get('build')!=3371: raise SystemExit('unexpected baseline')
          d['version']='2.3.3-dev666'; d['build']=3372
          d.setdefault('features',[]).insert(0,'Final Relative Placement Matrix preserves the existing one-BIB-per-dancer real-flag renderer, removes the legacy DOM text rewrite that flattened flags/identity markup, and keeps large couple identities with compact judge columns and all 12 rows visible.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev666.md').write_text('# BDC v2.3.3-dev666 — Final matrix clean identities\n\nBuild 3372\n\nRemoves the legacy Final matrix DOM rewrite that destroyed flag markup. Keeps one BIB, one real flag, and one name per dancer with 12 rows visible.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/final-matrix-clean-v666.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev666.md
          git diff --cached --check
          git commit -m 'Release dev666 clean Final matrix identities'
          git push origin HEAD:develop