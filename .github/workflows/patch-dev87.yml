name: Apply dev87 registration and judge UX patch
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/patch-dev87.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop, fetch-depth: 0}
      - name: Apply targeted UI patches
        shell: python
        run: |
          from pathlib import Path
          import json

          p=Path('registration-desk/index.php'); s=p.read_text()
          s=s.replace('<h2 class="h5 mb-1">Add competitor and assign bib</h2>','<h2 class="h5 mb-1">Add competitor</h2>')
          s=s.replace('Eligibility is checked by division and role before the competitor is added to this scoring round.','Eligibility is checked by division and role. Bib is optional and can be assigned when the physical bib is issued.')
          s=s.replace('id="toggleProvisional">Competitor missing from BDC</button>','id="toggleProvisional">+ Add New BDC Competitor</button>')
          s=s.replace('name="bib" required','name="bib" placeholder="Optional · assign later"')
          s=s.replace("document.querySelector('#toggleProvisional').textContent='Competitor missing from BDC';","document.querySelector('#toggleProvisional').textContent='+ Add New BDC Competitor';")
          s=s.replace("event.currentTarget.textContent=provisional?'Return to BDC search':'Competitor missing from BDC';","event.currentTarget.textContent=provisional?'Return to BDC search':'+ Add New BDC Competitor';")
          s=s.replace("notice('Competitor added and bib assigned','success')","notice('Competitor added'+(form.querySelector('[name=\"bib\"]').value?' and bib assigned':' · bib unassigned'),'success')")
          p.write_text(s)

          p=Path('judge-scoring/index.php'); s=p.read_text()
          s=s.replace('.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}', '.choices{display:grid;grid-template-columns:1.25fr 1.25fr repeat(3,1fr);gap:12px}')
          s=s.replace('.choice{border:1px solid #b8c0cc;background:#fff;border-radius:9px;padding:11px 6px;font-weight:800;cursor:pointer}', '.choice{border:1px solid #b8c0cc;background:#fff;border-radius:9px;padding:13px 8px;min-height:48px;font-weight:800;cursor:pointer}.choice[data-value="YES"]{border:2px solid #198754}.choice.clear{border:2px solid #dc3545;margin-left:8px}')
          s=s.replace('@media(max-width:520px){.choices{grid-template-columns:repeat(2,1fr)}.choices .clear{grid-column:span 2}}','@media(max-width:520px){.choices{grid-template-columns:repeat(2,1fr);gap:12px}.choices .clear{grid-column:span 2;margin-left:0}}')
          p.write_text(s)

          p=Path('admin/scoring/core.php'); s=p.read_text()
          old='<div class="alert alert-warning mb-3">The secure token is not visible in this session. Regenerate the desk link to create a new shareable URL.</div>'
          new='''<div class="alert alert-warning mb-3">The secure token is not visible in this session. Generate a new shareable URL below.<form method="post" action="registration-link.php" class="mt-2"><input type="hidden" name="_csrf" value="<?=e($csrf)?>"><input type="hidden" name="round_id" value="<?=$roundId?>"><button class="btn btn-primary btn-sm">Generate New Registration Desk Link</button></form><div class="small mt-2">Existing competitors, bibs, check-ins and ready status are preserved.</div></div>'''
          if old not in s: raise SystemExit('registration link warning anchor not found')
          s=s.replace(old,new,1); p.write_text(s)

          v=Path('VERSION.json'); d=json.loads(v.read_text()); d['version']='2.3.3-dev87'; d['build']=2417; d['release_date']='2026-08-09'; d['features']=[
            'Registration Desk can add genuinely new dancers through the shared official BDC ID service',
            'Registration Desk bib is optional at initial registration and can be assigned later',
            'Adds Generate New Registration Desk Link action when the secure token is unavailable',
            'Regenerating the Registration Desk link changes only the access token and preserves competitors, bibs, check-ins and ready status',
            'Registration live sync counts NULL or blank bibs as Missing Bibs',
            'Automatic judge YES and clear/NO controls have larger touch targets and safer visual spacing',
            'No scoring calculation or points logic changed',
            'No Staging or Production deployment performed'
          ]; v.write_text(json.dumps(d,indent=2)+'\n')
      - name: Commit patch
        run: |
          git config user.name "BDC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add registration-desk/index.php judge-scoring/index.php admin/scoring/core.php VERSION.json
          git rm .github/workflows/patch-dev87.yml
          git commit -m "feat(registration): improve desk links new competitors and judge controls"
          git push origin develop
