name: Release dev676 Final Couple Cleanup
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev676-final-couple-cleanup.yml'
permissions:
  contents: write
concurrency:
  group: release-dev676-final-couple-cleanup
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev676 release
        run: bash .github/scripts/release-dev676-final-couple-cleanup.sh
