name: Run Projector v660 Patch
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/run-projector-v660-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Apply patch
        run: |
          python3 scripts/projector-v660-patch.py
          php -l live-display/feed.php
          git diff --check
      - name: Commit release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/run-projector-v660-patch.yml
          git rm -f scripts/projector-v660-patch.py
          git rm -f .github/workflows/consolidate-projector-v660c.yml 2>/dev/null || true
          git rm -f .github/workflows/consolidate-projector-v660b.yml 2>/dev/null || true
          git rm -f .github/workflows/consolidate-projector-657-659-v660.yml 2>/dev/null || true
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev660.md
          git diff --cached --check
          git commit -m 'Release dev660 repair projector dev657-dev659'
          git push origin HEAD:develop