name: Apply Finalist Couples v655
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-finalist-couples-v655.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Patch Finalist Couples only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php')
          s=p.read_text()
          old='<div style="display:flex;flex-direction:column;align-items:center;min-width:0;max-width:44%"><img class="photo" src="<?= e($displayPhoto) ?>"'
          new='<div class="final-couple-person"><img class="photo" src="<?= e($displayPhoto) ?>"'
          if s.count(old)!=1:
              raise SystemExit(f'Finalist Couples container expected once, found {s.count(old)}')
          s=s.replace(old,new,1)
          marker='.list .item>div:nth-child(2)>div>div:nth-of-type(2){font-size:clamp(19px,1.55vw,38px);font-weight:950;line-height:1;color:#fff;margin:.04em 0}'
          css=marker+'.final-couple-person{display:grid!important;grid-template-columns:minmax(0,auto) auto;grid-template-rows:auto auto auto;align-items:center;justify-content:center;column-gap:clamp(5px,.42vw,10px);row-gap:clamp(1px,.16vh,3px);min-width:0;max-width:48%!important;padding-bottom:clamp(6px,.55vh,12px)}.final-couple-person>.photo{grid-column:1/3;grid-row:1;justify-self:center}.final-couple-person>.name{grid-column:1;grid-row:2;min-width:0;max-width:100%;font-size:clamp(16px,1.18vw,28px)!important;font-weight:950;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.final-couple-person>.flight-country{grid-column:2;grid-row:2;display:flex!important;align-items:center;justify-content:flex-start;margin:0!important;padding:0!important;font-size:0!important;line-height:0!important;min-width:0}.final-couple-person>.flight-country img{width:clamp(27px,1.9vw,42px)!important;height:auto!important;aspect-ratio:3/2;object-fit:cover;border:1px solid rgba(255,255,255,.78)!important;border-radius:3px!important;box-shadow:0 2px 5px rgba(0,0,0,.3)}.final-couple-person>.small:not(.flight-country){grid-column:1/3;grid-row:3;font-size:clamp(19px,1.55vw,38px)!important;font-weight:950;line-height:1;color:#fff;margin:.08em 0 0}'
          if s.count(marker)!=1:
              raise SystemExit(f'Couple style marker expected once, found {s.count(marker)}')
          s=s.replace(marker,css,1)
          p.write_text(s)
          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev654' or d.get('build')!=3360:
              raise SystemExit(f'Unexpected version {d.get("version")} build {d.get("build")}')
          d['version']='2.3.3-dev655'; d['build']=3361; d['release_date']='2026-09-06'
          d.setdefault('features',[]).insert(0,'Finalist Couples only: enlarges dancer names, positions the real country flag immediately after each name, visually removes country text, and keeps BIB below while preserving the separate Finalists screen and five-card couple grid.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev655.md').write_text('# BDC v2.3.3-dev655 — Finalist Couples identity layout\n\nBuild 3361\n\nChanges only Finalist Couples: larger single-line names, real flag immediately after the name, country text hidden, BIB below. Separate Finalists screen and five-card responsive grid are preserved.\n')
          Path('tests/finalist-couples-v655.php').write_text('<?php\ndeclare(strict_types=1);\n$f=file_get_contents(__DIR__."/../live-display/feed.php");\nif(!str_contains($f,"final-couple-person"))throw new RuntimeException("Final couple class missing");\nif(!str_contains($f,"font-size:clamp(16px,1.18vw,28px)!important"))throw new RuntimeException("Final couple larger name missing");\nif(!str_contains($f,"font-size:0!important"))throw new RuntimeException("Country text hide missing");\nif(!str_contains($f,"$coupleColumns = 5;"))throw new RuntimeException("Five-card grid changed");\nif(!str_contains($f,"competitor-country-name"))throw new RuntimeException("Separate Finalists screen was altered");\necho "finalist couples v655: PASS\\n";\n')
          PY
          php -l live-display/feed.php
          php tests/finalist-couples-v655.php
          git diff --check
      - name: Commit verified release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-finalist-couples-v655.yml
          git rm -f .github/workflows/restore-feed-dev652-v654.yml 2>/dev/null || true
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev655.md tests/finalist-couples-v655.php
          git diff --cached --check
          git commit -m 'Release dev655 Finalist Couples name and flag layout'
          git push origin HEAD:develop
