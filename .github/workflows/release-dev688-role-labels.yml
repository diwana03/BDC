name: Release dev688 Role Labels
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev688-role-labels.yml'
permissions:
  contents: write
concurrency:
  group: release-dev688-role-labels
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply role-labelled judge instructions
        run: bash .github/scripts/release-dev688-role-labels.sh
