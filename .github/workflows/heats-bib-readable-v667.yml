name: Heats BIB Readable v667
on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/heats-bib-readable-v667.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Enlarge Heats BIB only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php')
          s=p.read_text()
          old='.matrix-heats th:nth-child(2),.matrix-heats td:nth-child(2){width:9%;font-size:.96em;font-weight:950;text-align:center}'
          new='.matrix-heats th:nth-child(2),.matrix-heats td:nth-child(2){width:10%;font-weight:950;text-align:center}.matrix-heats th:nth-child(2){font-size:.72em}.matrix-heats td:nth-child(2){font-size:clamp(17px,1.16vw,28px)!important;letter-spacing:.025em}'
          if s.count(old)!=1:
              raise SystemExit('Heats BIB CSS anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          v=Path('VERSION.json')
          d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev666' or d.get('build')!=3372:
              raise SystemExit('unexpected baseline')
          d['version']='2.3.3-dev667'
          d['build']=3373
          d.setdefault('features',[]).insert(0,'Heats projector BIB readability: substantially larger BIB numbers while preserving the current competitor-name size, role-specific judge columns, flags, scores and two-panel layout.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev667.md').write_text('# BDC v2.3.3-dev667 — Heats BIB readability\n\nBuild 3373\n\nEnlarges BIB numbers on the Heats Live Score Matrix without changing competitor-name sizing or scoring logic.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/heats-bib-readable-v667.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev667.md
          git diff --cached --check
          git commit -m 'Release dev667 enlarge Heats projection BIB'
          git push origin HEAD:develop