name: Release dev705 Final Matrix And Tie Report
on:
  push:
    paths:
      - '.github/scripts/release-dev705-final-matrix-tie-report.sh'
      - '.github/workflows/release-dev705-final-matrix-tie-report.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev705
        run: bash .github/scripts/release-dev705-final-matrix-tie-report.sh
