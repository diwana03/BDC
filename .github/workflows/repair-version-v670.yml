name: Repair Version v670
on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/repair-version-v670.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Restore full version history and bump
        run: |
          git cat-file blob b40e8d316b1960e2176a957476e32d04d2164cce > VERSION.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VERSION.json')
          d=json.loads(p.read_text())
          d['version']='2.3.3-dev670'
          d['build']=3376
          feature='Heats ballroom readability pass: Prov., J labels, judge names, YES/A marks and Score are enlarged aggressively without shrinking BIB, flags or competitor names.'
          if feature not in d['features']:
              d['features'].insert(0,feature)
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit repaired metadata
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/repair-version-v670.yml
          git add VERSION.json
          git commit -m 'Repair dev670 version metadata'
          git push origin HEAD:develop