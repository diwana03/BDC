name: Release dev692 MCP Auth Path
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev692-mcp-auth-path.yml'
permissions:
  contents: write
concurrency:
  group: release-dev692-mcp-auth-path
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Repair MCP bearer and refresh execution path
        run: bash .github/scripts/release-dev692-mcp-auth-path.sh
