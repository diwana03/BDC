name: Heats Marks Fit v674
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/heats-marks-fit-v674.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Fit Heats judge marks without changing safe area
        run: |
          cat >> public/css/projector-safe-v616.css <<'CSS'

/* dev674 Heats: slightly reduce only YES/A1/A2/A3 marks so every judge value fits its cell. */
body[data-screen-type="score_matrix"]:has(.matrix-heats) .matrix-heats tbody td:nth-child(n+4):not(:last-child){
  font-size:clamp(14px,.88vw,21px)!important;
  letter-spacing:-.015em!important;
  white-space:nowrap!important;
  overflow:hidden!important;
  text-overflow:clip!important;
}
CSS
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VERSION.json')
          d=json.loads(p.read_text())
          d['version']='2.3.3-dev674'
          d['build']=3380
          d.setdefault('features',[]).insert(0,'Heats projector keeps the dev672 10% top/bottom and 5% left/right safe area while slightly reducing only YES/A1/A2/A3 judge marks so every value fits cleanly inside its judge cell; BIB, flags, competitor names, headers and Score remain unchanged.')
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          git diff --check
      - name: Commit release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/heats-marks-fit-v674.yml
          git add public/css/projector-safe-v616.css VERSION.json
          git commit -m 'Release dev674 Heats judge mark fit'
          git push origin HEAD:develop
