name: Release dev703 Final Matrix Standard Row
on:
  push:
    paths:
      - '.github/scripts/release-dev703-final-matrix-standard-row.sh'
      - '.github/workflows/release-dev703-final-matrix-standard-row.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev703
        run: bash .github/scripts/release-dev703-final-matrix-standard-row.sh
