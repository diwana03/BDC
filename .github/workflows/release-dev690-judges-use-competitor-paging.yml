name: Release dev690 Judges Competitor Paging
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev690-judges-use-competitor-paging.yml'
permissions:
  contents: write
concurrency:
  group: release-dev690-judges-use-competitor-paging
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply competitor-style judge paging
        run: bash .github/scripts/release-dev690-judges-use-competitor-paging.sh
