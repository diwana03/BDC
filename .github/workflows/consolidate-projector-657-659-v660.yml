name: Consolidate Projector 657-659 v660
on:
  push:
    branches: [develop]
    paths: [.github/workflows/consolidate-projector-657-659-v660.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Consolidate matrix and matching renderers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,re

          p=Path('live-display/feed.php')
          s=p.read_text()

          # dev658 bug: matching request is normalized to matching_couples before render.
          old='elseif ($type === "matching"): ?><style>.matching-list'
          new='elseif (in_array($type, ["matching", "matching_couples"], true)): ?><style>.matching-list'
          if s.count(old)!=1:
              raise SystemExit(f'matching renderer gate mismatch: {s.count(old)}')
          s=s.replace(old,new,1)

          # Replace the accumulated dev656-659 score-matrix CSS with one coherent block.
          pattern=r'<style>\.matrix-wrap\{.*?</style><div class="matrix-wrap">'
          replacement='''<style>
.matrix-wrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 0 .15%;container-type:size}
.provisional-label{flex:0 0 auto;color:#ffcf45;font-weight:900;letter-spacing:.08em;margin:0 0 .25em;font-size:max(9px,min(.72cqw,1.25cqh))}
.score-table.matrix{width:100%;border-collapse:collapse;table-layout:fixed;background:rgba(17,24,39,.82)}
.score-table.matrix th,.score-table.matrix td{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.score-table.matrix th.name,.score-table.matrix td.name{text-align:left}
.score-table.matrix td.not-applicable{color:#94a3b8;background:rgba(148,163,184,.08);font-weight:850;letter-spacing:.04em}

/* FINAL: one fixed-height table. Header + all 12 finalist rows must remain inside the safe 16:9 body. */
.matrix-final{flex:1;min-height:0;height:100%;font-size:max(11px,min(1.02cqw,1.78cqh))}
.matrix-final thead{height:7.5%}
.matrix-final tbody{height:92.5%}
.matrix-final thead tr{height:100%}
.matrix-final tbody tr{height:8.333%}
.matrix-final th,.matrix-final td{padding:0 .32em!important}
.matrix-final th:first-child,.matrix-final td:first-child{width:10%;font-size:1.02em;font-weight:900}
.matrix-final th:nth-child(2),.matrix-final td:nth-child(2){width:40%;font-size:1.04em;font-weight:950;text-align:left}
.matrix-final th:nth-child(n+3){font-size:.82em;line-height:1.02}
.matrix-final th:nth-child(n+3) small{font-size:.68em;display:block;overflow:hidden;text-overflow:ellipsis}
.matrix-final td:nth-child(n+3){font-size:1.06em;font-weight:900}

/* HEATS: two equal panels. Keep role header fixed and fit the paginated rows without clipping. */
.matrix-split{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1%}
.matrix-panel{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.matrix-role{flex:0 0 auto;display:flex;justify-content:space-between;gap:1em;background:#111827;border:1px solid rgba(255,255,255,.35);padding:.36em .55em;font-size:max(11px,min(.9cqw,1.58cqh));font-weight:950;letter-spacing:.07em;white-space:nowrap}
.matrix-heats{flex:1;min-height:0;height:100%;font-size:max(9px,min(.72cqw,1.28cqh))}
.matrix-heats thead{height:8%}.matrix-heats tbody{height:92%}.matrix-heats thead tr{height:100%}.matrix-heats tbody tr{height:auto}
.matrix-heats th,.matrix-heats td{padding:0 .24em!important}
.matrix-heats th:first-child,.matrix-heats td:first-child{width:9%;font-weight:900}
.matrix-heats th:nth-child(2),.matrix-heats td:nth-child(2){width:31%;font-size:1.06em;font-weight:950;text-align:left}
.matrix-heats th:nth-child(n+3){font-size:.8em;line-height:1.02}.matrix-heats th:nth-child(n+3) small{font-size:.64em;display:block;overflow:hidden;text-overflow:ellipsis}
.matrix-heats td:nth-child(n+3){font-size:1.04em;font-weight:900}
</style><div class="matrix-wrap">'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'matrix CSS block mismatch: {n}')
          s=s2

          # Give final and heats tables explicit classes so the CSS is round-specific, not stacked global overrides.
          old_final='<table class="score-table matrix"><thead><tr><th>Place</th><th>Couple</th>'
          new_final='<table class="score-table matrix matrix-final"><thead><tr><th>Place</th><th>Couple</th>'
          if s.count(old_final)!=1:
              raise SystemExit(f'final matrix table mismatch: {s.count(old_final)}')
          s=s.replace(old_final,new_final,1)

          old_heats='<table class="score-table matrix"><thead><tr><th>Prov.</th><th class="name">Competitor</th>'
          new_heats='<table class="score-table matrix matrix-heats"><thead><tr><th>Prov.</th><th class="name">Competitor</th>'
          if s.count(old_heats)!=1:
              raise SystemExit(f'heats matrix table mismatch: {s.count(old_heats)}')
          s=s.replace(old_heats,new_heats,1)

          # Make the emcee matching layout fit 12 couples in 5/5/2 without clipping.
          s=s.replace('.matching-list .matching-card{box-sizing:border-box;flex:0 0 calc(20% - .65%);height:calc((100% - 1.3%)/3);padding:clamp(5px,.7vw,13px);justify-content:space-evenly;min-height:0}',
                      '.matching-list .matching-card{box-sizing:border-box;flex:0 0 calc(20% - .65%);height:calc((100% - 1.3%)/3);padding:clamp(3px,.42vw,8px);justify-content:center;gap:clamp(2px,.28vh,5px);min-height:0;overflow:hidden}')
          s=s.replace('.matching-photo{width:min(7vw,10vh)!important;height:min(7vw,10vh)!important;margin-bottom:.22em!important}',
                      '.matching-photo{width:min(5.6vw,6.8vh)!important;height:min(5.6vw,6.8vh)!important;margin:0 0 .12em!important}')
          s=s.replace('.matching-name{min-width:0;font-size:clamp(16px,1.18vw,28px)!important;',
                      '.matching-name{min-width:0;font-size:clamp(13px,.98vw,22px)!important;')
          s=s.replace('.matching-bib{font-size:clamp(19px,1.55vw,38px)!important;',
                      '.matching-bib{font-size:clamp(16px,1.18vw,28px)!important;')
          s=s.replace('.matching-flag{flex:0 0 auto;width:clamp(27px,1.9vw,42px);',
                      '.matching-flag{flex:0 0 auto;width:clamp(24px,1.55vw,34px);')

          p.write_text(s)

          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev659' or d.get('build')!=3365:
              raise SystemExit(f'unexpected version {d.get("version")} build {d.get("build")}')
          d['version']='2.3.3-dev660'; d['build']=3366; d['release_date']='2026-09-06'
          d.setdefault('features',[]).insert(0,'Audit repair for dev657-dev659: activates the Emcee matching_couples renderer, consolidates Final/Heats matrix CSS into round-specific layouts, and guarantees all 12 Final matrix rows fit the projector body without clipping.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

          Path('RELEASE-v2.3.3-dev660.md').write_text('''# BDC v2.3.3-dev660 — dev657-dev659 projector audit repair

Build 3366

- Fixes dev658 routing bug: matching requests render as `matching_couples`, so the new Emcee card renderer now actually runs.
- Replaces stacked dev657/dev659 matrix overrides with one Final layout and one Heats layout.
- Final matrix reserves explicit table height for header plus 12 rows, preventing Couple 12 clipping.
- Heats matrix preserves Leader/Follower split and pagination with bounded typography.
- Emcee matching uses a 5/5/2 responsive board with smaller safe photos, full first names, flags beside names and large BIBs.
- No scoring, pairing, judge, roster or result data logic changed.
''')

          Path('tests/projector-657-659-v660.php').write_text(r'''<?php
declare(strict_types=1);
$f=file_get_contents(__DIR__.'/../live-display/feed.php');
foreach([
  'in_array($type, ["matching", "matching_couples"], true)' => 'matching_couples renderer gate',
  'matrix matrix-final' => 'final matrix class',
  'matrix matrix-heats' => 'heats matrix class',
  '.matrix-final tbody tr{height:8.333%}' => '12-row final fit',
  '.matching-list .matching-card' => 'matching card layout',
] as $needle=>$label){if(!str_contains($f,$needle))throw new RuntimeException("Missing $label");}
if(str_contains($f,'body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix'))throw new RuntimeException('Old stacked heats matrix override remains');
if(str_contains($f,'body[data-screen-type="score_matrix"] .matrix-wrap>.score-table.matrix'))throw new RuntimeException('Old stacked final matrix override remains');
echo "projector 657-659 v660: PASS\n";
''')
          PY
          php -l live-display/feed.php
          php tests/projector-657-659-v660.php
          git diff --check
      - name: Commit repaired release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/consolidate-projector-657-659-v660.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev660.md tests/projector-657-659-v660.php
          git diff --cached --check
          git commit -m 'Release dev660 consolidate and repair projector dev657-dev659'
          git push origin HEAD:develop