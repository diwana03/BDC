name: Heats Matrix Compact v661
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/heats-matrix-compact-v661.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Compact heats supporting text only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php')
          s=p.read_text()
          replacements={
            '.matrix-role{flex:0 0 auto;display:flex;justify-content:space-between;gap:1em;background:#111827;border:1px solid rgba(255,255,255,.35);padding:.34em .52em;font-size:max(11px,min(.88cqw,1.52cqh));font-weight:950;letter-spacing:.07em;white-space:nowrap}':
            '.matrix-role{flex:0 0 auto;display:flex;justify-content:space-between;gap:.7em;background:#111827;border:1px solid rgba(255,255,255,.35);padding:.28em .42em;font-size:max(9px,min(.72cqw,1.22cqh));font-weight:950;letter-spacing:.055em;white-space:nowrap}',
            '.matrix-heats{flex:1;min-height:0;height:100%;font-size:max(9px,min(.7cqw,1.22cqh))}':
            '.matrix-heats{flex:1;min-height:0;height:100%;font-size:max(8px,min(.61cqw,1.08cqh))}',
            '.matrix-heats th,.matrix-heats td{padding:0 .22em!important}':
            '.matrix-heats th,.matrix-heats td{padding:0 .13em!important}',
            '.matrix-heats th:first-child,.matrix-heats td:first-child{width:9%;font-weight:900}':
            '.matrix-heats th:first-child,.matrix-heats td:first-child{width:8%;font-size:.9em;font-weight:900}',
            '.matrix-heats th:nth-child(2),.matrix-heats td:nth-child(2){width:31%;font-size:1.05em;font-weight:950;text-align:left}':
            '.matrix-heats th:nth-child(2),.matrix-heats td:nth-child(2){width:34%;font-size:1.18em;font-weight:950;text-align:left}',
            '.matrix-heats th:nth-child(n+3){font-size:.78em}':
            '.matrix-heats th:nth-child(n+3){font-size:.66em;letter-spacing:-.01em}',
            '.matrix-heats th:nth-child(n+3) small{font-size:.62em;display:block;overflow:hidden;text-overflow:ellipsis}':
            '.matrix-heats th:nth-child(n+3) small{font-size:.52em;display:block;overflow:hidden;text-overflow:ellipsis}',
            '.matrix-heats td:nth-child(n+3){font-size:1.03em;font-weight:900}':
            '.matrix-heats td:nth-child(n+3){font-size:.88em;font-weight:850}'
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit('missing expected heats css: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s)
          v=Path('VERSION.json')
          d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev660' or d.get('build')!=3366:
            raise SystemExit(f"unexpected version {d.get('version')} build {d.get('build')}")
          d['version']='2.3.3-dev661'
          d['build']=3367
          d.setdefault('features',[]).insert(0,'Heats matrix fit: preserves and slightly strengthens competitor names while reducing provisional, judge header/name, mark, N/A and score typography and padding so both role panels fit cleanly on the 16:9 projector.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev661.md').write_text('# BDC v2.3.3-dev661 — compact Heats matrix\n\nBuild 3367\n\nKeeps competitor names large and readable. Reduces only supporting Heats matrix text and padding: provisional rank, judge headers and names, marks, N/A and score. No scoring or pagination logic changed.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit dev661
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/heats-matrix-compact-v661.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev661.md
          git commit -m 'Release dev661 compact heats matrix supporting text'
          git push origin HEAD:develop