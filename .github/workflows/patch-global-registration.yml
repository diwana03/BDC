name: Wire global scoring registration hook

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch-global-registration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch bootstrap
        shell: python
        run: |
          from pathlib import Path
          p=Path('bootstrap.php')
          s=p.read_text()
          anchor="if ($bdcTestMode !== '') {\n    $_SESSION['bdc_test_scoring_mode'] = $bdcTestMode;\n}\n"
          insert=anchor+"\n/* Global new-competitor creation for Manual, Automatic and Test scoring. */\n\\App\\Services\\GlobalScoringRegistrationHook::handle($bdcBootstrapMethod,$bdcBootstrapPath,$bdcTestMode);\n"
          if 'GlobalScoringRegistrationHook::handle' not in s:
              if anchor not in s:
                  raise SystemExit('bootstrap anchor not found')
              s=s.replace(anchor,insert,1)
          p.write_text(s)
      - name: Remove one-time workflow and commit
        run: |
          git config user.name "BDC Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-global-registration.yml
          git add bootstrap.php
          git commit -m "feat(registration): use global BDC identity creation across scoring" || exit 0
          git push origin develop
