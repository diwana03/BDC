name: Release dev677 Adaptive Judges
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev677-adaptive-judges.yml'
permissions:
  contents: write
concurrency:
  group: release-dev677-adaptive-judges
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev677 release
        run: bash .github/scripts/release-dev677-adaptive-judges.sh
