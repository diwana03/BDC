name: Release dev677 Final Matrix Row Alignment
on:
  push:
    branches: [develop]
    paths:
      - '.github/scripts/release-dev677-final-matrix-row-alignment.sh'
      - '.github/workflows/release-dev677-final-matrix-row-alignment.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply and release dev677
        run: bash .github/scripts/release-dev677-final-matrix-row-alignment.sh
