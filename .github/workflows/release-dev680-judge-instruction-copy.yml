name: Release dev680 Judge Instruction Copy
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/release-dev680-judge-instruction-copy.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply judge instruction copy update
        run: bash .github/scripts/release-dev680-judge-instruction-copy.sh
