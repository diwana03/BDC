name: Final Matrix Readability v663
on:
  push:
    branches: [develop]
    paths: [.github/workflows/final-matrix-readable-v663.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Enlarge Final matrix only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json,re
          p=Path('live-display/feed.php')
          s=p.read_text()
          replacements={
            r'\.matrix-final\{flex:1;min-height:0;height:100%;font-size:[^}]+\}':'.matrix-final{flex:1;min-height:0;height:100%;font-size:max(15px,min(1.45cqw,3cqh))}',
            r'\.matrix-final th:first-child,\.matrix-final td:first-child\{[^}]+\}':'.matrix-final th:first-child,.matrix-final td:first-child{width:9%;font-size:1.12em;font-weight:950}',
            r'\.matrix-final th:nth-child\(2\),\.matrix-final td:nth-child\(2\)\{[^}]+\}':'.matrix-final th:nth-child(2),.matrix-final td:nth-child(2){width:43%;font-size:1.10em;font-weight:950;text-align:left}',
            r'\.matrix-final th:nth-child\(n\+3\)\{[^}]+\}':'.matrix-final th:nth-child(n+3){font-size:.60em;line-height:1.02}',
            r'\.matrix-final th:nth-child\(n\+3\) small\{[^}]+\}':'.matrix-final th:nth-child(n+3) small{font-size:.72em;display:block;overflow:hidden;text-overflow:ellipsis}',
            r'\.matrix-final td:nth-child\(n\+3\)\{[^}]+\}':'.matrix-final td:nth-child(n+3){font-size:1.12em;font-weight:950}',
          }
          for pattern,new in replacements.items():
              s2,n=re.subn(pattern,new,s,count=1)
              if n!=1: raise SystemExit(f'final matrix selector mismatch: {pattern} => {n}')
              s=s2
          p.write_text(s)
          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev662' or d.get('build')!=3368: raise SystemExit('unexpected version')
          d['version']='2.3.3-dev663'; d['build']=3369; d['release_date']='2026-09-06'
          d.setdefault('features',[]).insert(0,'Final projector matrix readability: keeps all 12 couples within the 16:9 safe area while substantially enlarging couple text and placement values; judge headings remain compact. Heats layout is unchanged.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev663.md').write_text('# BDC v2.3.3-dev663 — Final matrix readability\n\nBuild 3369\n\nFinal only: larger couple and placement text with compact judge headings while preserving all 12 rows. Heats projector unchanged.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/final-matrix-readable-v663.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev663.md
          git commit -m 'Release dev663 enlarge Final matrix without clipping'
          git push origin HEAD:develop