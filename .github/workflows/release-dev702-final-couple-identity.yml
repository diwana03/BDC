name: Release dev702 Final Couple Identity
on:
  push:
    paths:
      - '.github/scripts/release-dev702-final-couple-identity.sh'
      - '.github/workflows/release-dev702-final-couple-identity.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev702
        run: bash .github/scripts/release-dev702-final-couple-identity.sh
