name: Release dev701 Final Matrix Presentation
on:
  push:
    paths:
      - '.github/scripts/release-dev701-final-matrix-presentation.sh'
      - '.github/workflows/release-dev701-final-matrix-presentation.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply dev701
        run: bash .github/scripts/release-dev701-final-matrix-presentation.sh
