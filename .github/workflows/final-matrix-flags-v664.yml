name: Final Matrix Flags v664
on:
  push:
    branches: [develop]
    paths: [.github/workflows/final-matrix-flags-v664.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Add real flags to Final couple cell
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php')
          s=p.read_text()
          old='<td class="name">#<?=(int)$x["pair_number"]?> <?=e((string)$x["leader_name"])?> &amp; <?=e((string)$x["follower_name"])?></td>'
          new='''<td class="name final-matrix-couple"><span class="final-matrix-person"><strong>BIB <?=(int)$x["leader_bib"]?></strong><?php if($leaderFlag=country_flag_url((string)($x["leader_country"]??""))):?><img class="final-matrix-flag" src="<?=e($leaderFlag)?>" alt="<?=e((string)$x["leader_country"])?> flag"><?php endif;?><span><?=e((string)$x["leader_name"])?></span></span><span class="final-matrix-amp">&amp;</span><span class="final-matrix-person"><strong>BIB <?=(int)$x["follower_bib"]?></strong><?php if($followerFlag=country_flag_url((string)($x["follower_country"]??""))):?><img class="final-matrix-flag" src="<?=e($followerFlag)?>" alt="<?=e((string)$x["follower_country"])?> flag"><?php endif;?><span><?=e((string)$x["follower_name"])?></span></span></td>'''
          if s.count(old)!=1: raise SystemExit('Final couple cell anchor mismatch')
          s=s.replace(old,new,1)
          css='.matrix-final .final-matrix-couple{font-size:clamp(18px,1.24vw,30px)!important;white-space:nowrap;overflow:hidden}.final-matrix-person{display:inline-flex;align-items:center;gap:clamp(4px,.32vw,8px);min-width:0}.final-matrix-person strong{font-size:.82em;flex:0 0 auto}.final-matrix-person span{font-weight:950;overflow:hidden;text-overflow:ellipsis}.final-matrix-amp{display:inline-block;margin:0 clamp(5px,.38vw,10px);font-weight:950}.final-matrix-flag{display:inline-block;width:clamp(24px,1.55vw,38px);height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid rgba(255,255,255,.78);border-radius:3px;vertical-align:middle;flex:0 0 auto}'
          anchor='.matrix-final th:nth-child(n+3){font-size:.60em;line-height:1.02}'
          if s.count(anchor)!=1: raise SystemExit('Final matrix CSS anchor mismatch')
          s=s.replace(anchor,anchor+css,1)
          p.write_text(s)
          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev663' or d.get('build')!=3369: raise SystemExit(f'unexpected version {d.get("version")} build {d.get("build")}')
          d['version']='2.3.3-dev664'; d['build']=3370; d['release_date']='2026-09-06'
          d.setdefault('features',[]).insert(0,'Final relative placement matrix now shows real country flags beside each finalist name and removes tiny country-code clutter, while preserving large couple text and the guaranteed 12-row 16:9 fit.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev664.md').write_text('# BDC v2.3.3-dev664 — Final matrix flags\n\nBuild 3370\n\nAdds real country flags beside both dancers in the Final relative placement matrix and keeps all 12 rows visible.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/final-matrix-flags-v664.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev664.md
          git commit -m 'Release dev664 add Final matrix country flags'
          git push origin HEAD:develop