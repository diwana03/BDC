name: Apply 30 Day Admin Login Persistence v650
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/apply-admin-remember-login-v650.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Apply guarded authentication persistence fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def one(path, old, new, label):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old,new,1))

          auth='app/Core/Auth.php'

          one(auth,
              "        $valid=$row&&hash_equals((string)$row['token_hash'],hash('sha256',$parsed['token']))&&hash_equals((string)$row['user_agent_hash'],hash('sha256',(string)($_SERVER['HTTP_USER_AGENT']??'')));",
              "        // The secure random trusted-device token is the authentication credential.\n        // Do not invalidate it merely because the browser's User-Agent version changes during the 30-day window.\n        $valid=$row&&hash_equals((string)$row['token_hash'],hash('sha256',$parsed['token']));",
              'trusted device browser-update tolerance')

          one(auth,
              "            && hash_equals((string)$row['token_hash'],hash('sha256',$parsed['token']))\n            && hash_equals((string)$row['user_agent_hash'],hash('sha256',(string)($_SERVER['HTTP_USER_AGENT']??'')));",
              "            && hash_equals((string)$row['token_hash'],hash('sha256',$parsed['token']));",
              'remembered login browser-update tolerance')

          one(auth,
              "        if($remember)self::rememberDevice((int)$user['id']);self::audit((int)$user['id'],'two_factor_verified',['remembered'=>$remember]);return true;",
              "        // BDC admin policy: a successful two-factor login is remembered for 30 days.\n        // Explicit logout still revokes the trusted token immediately.\n        self::rememberDevice((int)$user['id']);self::audit((int)$user['id'],'two_factor_verified',['remembered'=>true,'remember_days'=>30]);return true;",
              'always remember verified admin login')

          login='app/Views/auth/login.php'
          one(login,
              '<div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember_device" id="rememberDevice"><label class="form-check-label" for="rememberDevice">Remember this computer for 30 days</label></div>',
              '<div class="alert alert-secondary py-2 small mb-3">This browser will stay signed in for 30 days after verification. Explicit logout still signs it out immediately.</div>',
              'login screen 30-day policy text')

          Path('tests/admin-remember-login-v650.js').write_text('''const fs=require('fs');\nconst auth=fs.readFileSync('app/Core/Auth.php','utf8');\nconst login=fs.readFileSync('app/Views/auth/login.php','utf8');\nif(!auth.includes("self::rememberDevice((int)$user['id']);"))throw new Error('30-day trusted device is not created after 2FA');\nif(auth.includes("$row['user_agent_hash'],hash('sha256',(string)($_SERVER['HTTP_USER_AGENT']??''))"))throw new Error('Trusted login is still invalidated by exact User-Agent changes');\nif(!auth.includes("'remember_days'=>30"))throw new Error('30-day auth audit marker missing');\nif(!login.includes('stay signed in for 30 days'))throw new Error('30-day login policy is not visible at 2FA');\nif(login.includes('name="remember_device"'))throw new Error('30-day persistence must not depend on an unchecked checkbox');\nconsole.log('admin remember login v650: PASS');\n''')

          version=Path('VERSION.json'); data=json.loads(version.read_text())
          if data.get('version')!='2.3.3-dev649' or data.get('build')!=3355:
              raise SystemExit(f'Unexpected VERSION.json {data.get("version")} build {data.get("build")}')
          data['version']='2.3.3-dev650'; data['build']=3356; data['release_date']='2026-09-06'
          data.setdefault('features',[]).insert(0,'Makes successful BDC admin two-factor logins persist for the promised 30 days automatically, restores them after normal PHP session expiry, and prevents routine browser User-Agent version changes from invalidating the secure trusted-device token; explicit logout still revokes access immediately.')
          version.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          Path('RELEASE-v2.3.3-dev650.md').write_text('''# BDC v2.3.3-dev650 — 30-day admin login persistence\n\nBuild 3356\n\n## Fix\n\n- Successful admin two-factor verification now always creates the existing secure 30-day trusted-device login.\n- Removes the unchecked opt-in checkbox that allowed a normal two-hour PHP session to be mistaken for a 30-day login.\n- Stops binding the trusted-device token to the exact browser User-Agent string, so routine Chrome/browser version updates cannot invalidate an otherwise valid 30-day token.\n- Keeps the random selector/token credential, database expiry, Secure + HttpOnly + SameSite=Lax cookie, role/status checks, audit trail, and immediate revocation on explicit logout.\n- Existing already-revoked/expired trusted tokens are not resurrected; after deployment, one successful 2FA login creates a fresh 30-day token.\n\n## Validation\n\n- PHP 8.1 syntax checks on authentication and login view.\n- Focused regression verifies automatic 30-day issuance, browser-update tolerance and removal of checkbox dependency.\n- No database migration.\n''')
          PY
          php -l app/Core/Auth.php
          php -l app/Views/auth/login.php
          node tests/admin-remember-login-v650.js
          git diff --check
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-admin-remember-login-v650.yml
          git add app/Core/Auth.php app/Views/auth/login.php tests/admin-remember-login-v650.js VERSION.json RELEASE-v2.3.3-dev650.md
          git diff --cached --check
          git commit -m 'Release dev650 30-day admin login persistence'
          git push origin HEAD:develop
