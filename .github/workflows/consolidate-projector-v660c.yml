name: Consolidate Projector v660c
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/consolidate-projector-v660c.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Repair projector changes
        run: |
          python3 -c "from pathlib import Path; import re,json,base64; p=Path('live-display/feed.php'); s=p.read_text(); gate='elseif ($type === \\\"matching\\\"): ?><style>.matching-list'; assert s.count(gate)==1; s=s.replace(gate,'elseif (in_array($type, [\\\"matching\\\", \\\"matching_couples\\\"], true)): ?><style>.matching-list',1); css=base64.b64decode('').decode(); s,n=re.subn(r'<style>\\.matrix-wrap\\{.*?</style><div class=\\\"matrix-wrap\\\">',css,s,count=1,flags=re.S); assert n==1; f='<table class=\\\"score-table matrix\\\"><thead><tr><th>Place</th><th>Couple</th>'; h='<table class=\\\"score-table matrix\\\"><thead><tr><th>Prov.</th><th class=\\\"name\\\">Competitor</th>'; assert s.count(f)==1 and s.count(h)==1; s=s.replace(f,'<table class=\\\"score-table matrix matrix-final\\\"><thead><tr><th>Place</th><th>Couple</th>',1); s=s.replace(h,'<table class=\\\"score-table matrix matrix-heats\\\"><thead><tr><th>Prov.</th><th class=\\\"name\\\">Competitor</th>',1); reps={'.matching-list .matching-card{box-sizing:border-box;flex:0 0 calc(20% - .65%);height:calc((100% - 1.3%)/3);padding:clamp(5px,.7vw,13px);justify-content:space-evenly;min-height:0}':'.matching-list .matching-card{box-sizing:border-box;flex:0 0 calc(20% - .65%);height:calc((100% - 1.3%)/3);padding:clamp(3px,.42vw,8px);justify-content:center;gap:clamp(2px,.28vh,5px);min-height:0;overflow:hidden}', '.matching-photo{width:min(7vw,10vh)!important;height:min(7vw,10vh)!important;margin-bottom:.22em!important}':'.matching-photo{width:min(5.6vw,6.8vh)!important;height:min(5.6vw,6.8vh)!important;margin:0 0 .12em!important}', '.matching-name{min-width:0;font-size:clamp(16px,1.18vw,28px)!important;':'.matching-name{min-width:0;font-size:clamp(13px,.98vw,22px)!important;', '.matching-bib{font-size:clamp(19px,1.55vw,38px)!important;':'.matching-bib{font-size:clamp(16px,1.18vw,28px)!important;', '.matching-flag{flex:0 0 auto;width:clamp(27px,1.9vw,42px);':'.matching-flag{flex:0 0 auto;width:clamp(24px,1.55vw,34px);'}; [(s:=s.replace(a,b,1)) if a in s else (_ for _ in ()).throw(AssertionError(a)) for a,b in reps.items()]; p.write_text(s); v=Path('VERSION.json'); d=json.loads(v.read_text()); assert d.get('version')=='2.3.3-dev659' and d.get('build')==3365; d['version']='2.3.3-dev660'; d['build']=3366; d.setdefault('features',[]).insert(0,'Consolidated repair of dev657-dev659 projector changes: active Emcee matching_couples renderer, separated Final and Heats matrix layouts, and guaranteed 12-row Final fit.'); v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\\n'); Path('RELEASE-v2.3.3-dev660.md').write_text('# BDC v2.3.3-dev660 — projector audit repair\\n\\nBuild 3366\\n\\nRepairs dev657-dev659 as one coherent implementation. Emcee matching now routes correctly to matching_couples. Final and Heats matrices use separate bounded layouts. Final reserves all 12 rows so the bottom row cannot be clipped.\\n')"
          php -l live-display/feed.php
          grep -q 'matching_couples' live-display/feed.php
          grep -q 'matrix matrix-final' live-display/feed.php
          grep -q 'matrix matrix-heats' live-display/feed.php
          grep -q '.matrix-final tbody tr{height:8.333%}' live-display/feed.php
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/consolidate-projector-v660c.yml
          git rm -f .github/workflows/consolidate-projector-v660b.yml 2>/dev/null || true
          git rm -f .github/workflows/consolidate-projector-657-659-v660.yml 2>/dev/null || true
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev660.md
          git diff --cached --check
          git commit -m 'Release dev660 repair projector dev657-dev659'
          git push origin HEAD:develop