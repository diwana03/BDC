name: Apply Heats Matrix Readability v657
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-heats-matrix-readable-v657.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Enlarge Heats relative placement matrix only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php')
          s=p.read_text()
          anchor='.matrix-panel>.score-table.matrix{flex:1;height:auto}'
          if s.count(anchor)!=1:
              raise SystemExit(f'Heats matrix anchor expected once, found {s.count(anchor)}')
          extra=anchor+'body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix{font-size:clamp(11px,.96vw,22px);table-layout:fixed}body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix th,body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix td{padding:.42em .3em}body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix th:first-child,body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix td:first-child{width:9%;font-size:1.02em}body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix th:nth-child(2),body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix td:nth-child(2){width:31%;font-size:1.08em;font-weight:900}body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix th:nth-child(n+3){font-size:.86em;line-height:1.02}body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix th:nth-child(n+3) small{font-size:.68em}body[data-screen-type="score_matrix"] .matrix-panel>.score-table.matrix td:nth-child(n+3){font-size:1.08em;font-weight:850}.matrix-role{font-size:clamp(15px,1.18vw,28px)!important;padding:.48em .62em!important}'
          s=s.replace(anchor,extra,1)
          p.write_text(s)
          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev656' or d.get('build')!=3362:
              raise SystemExit(f'Unexpected version {d.get("version")} build {d.get("build")}')
          d['version']='2.3.3-dev657'; d['build']=3363; d['release_date']='2026-09-06'
          d.setdefault('features',[]).insert(0,'Heats Live Relative Placement Matrix readability: enlarges competitor names, judge headers, marks and role headers to use the available 16:9 projector space while preserving Leader/Follower split, pagination and scoring logic.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev657.md').write_text('# BDC v2.3.3-dev657 — Heats matrix readability\n\nBuild 3363\n\nEnlarges the Heats Live Relative Placement Matrix typography and role headers while preserving Leader/Follower split, pagination, marks and scoring logic.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit verified release
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-heats-matrix-readable-v657.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev657.md
          git diff --cached --check
          git commit -m 'Release dev657 enlarge Heats relative placement matrix'
          git push origin HEAD:develop