name: Apply Emcee Matching v658
on:
  push:
    branches: [develop]
    paths: [.github/workflows/apply-emcee-matching-v658.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.1', coverage: none}
      - name: Fix matching cards only
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('live-display/feed.php'); s=p.read_text()
          old='<?php elseif ($type === "matching"): ?><div class="list"><?php foreach ($items as $x): ?><div class="item"><div class="small">COUPLE <?= (int) $x["pair_number"] ?></div><div class="name">BIB <?= (int) $x["leader_bib"] ?> · <?= e(CountryFlagService::emoji($x["leader_country"] ?? null)) ?> <?= e($x["leader_name"]) ?></div><div style="font-size:clamp(24px,3vw,65px);color:#ffcf45">＋</div><div class="name">BIB <?= (int) $x["follower_bib"] ?> · <?= e(CountryFlagService::emoji($x["follower_country"] ?? null)) ?> <?= e($x["follower_name"]) ?></div></div><?php endforeach; ?></div>'
          new='''<?php elseif ($type === "matching"): ?><style>.matching-list{display:flex!important;flex-wrap:wrap;align-content:stretch;justify-content:center;gap:.65%;padding-bottom:.45%}.matching-list .matching-card{box-sizing:border-box;flex:0 0 calc(20% - .65%);height:calc((100% - 1.3%)/3);padding:clamp(5px,.7vw,13px);justify-content:space-evenly;min-height:0}.matching-pair{font-size:clamp(12px,.9vw,22px)!important;font-weight:950;letter-spacing:.08em}.matching-people{display:flex;align-items:center;justify-content:center;gap:clamp(14px,1.5vw,34px);width:100%;margin:.25em 0}.matching-person{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:44%}.matching-photo{width:min(7vw,10vh)!important;height:min(7vw,10vh)!important;margin-bottom:.22em!important}.matching-name-row{width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(5px,.42vw,10px);white-space:nowrap;overflow:hidden}.matching-name{min-width:0;font-size:clamp(16px,1.18vw,28px)!important;font-weight:950;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.matching-flag{flex:0 0 auto;width:clamp(27px,1.9vw,42px);height:auto;aspect-ratio:3/2;object-fit:cover;border:1px solid rgba(255,255,255,.78);border-radius:3px}.matching-bib{font-size:clamp(19px,1.55vw,38px)!important;font-weight:950;line-height:1;margin:.08em 0 0}@container (max-width:1100px){.matching-list .matching-card{flex-basis:calc(25% - .65%)}}@container (max-width:760px){.matching-list .matching-card{flex-basis:calc(33.333% - .65%)}}</style><div class="list matching-list"><?php foreach ($items as $x): ?><div class="item matching-card"><div class="small matching-pair">COUPLE <?= (int) $x["pair_number"] ?></div><div class="matching-people"><?php foreach([["name"=>$x["leader_name"],"bib"=>$x["leader_bib"],"country"=>$x["leader_country"]??""],["name"=>$x["follower_name"],"bib"=>$x["follower_bib"],"country"=>$x["follower_country"]??""]] as $person):$fallbackPhoto=$animalPhoto((string)(($person["bib"]??"")."|".($person["name"]??"")));$personPhoto="";foreach($items as $photoRow){if(($photoRow["leader_bib"]??null)===$person["bib"])$personPhoto=(string)($photoRow["leader_photo"]??"");if(($photoRow["follower_bib"]??null)===$person["bib"])$personPhoto=(string)($photoRow["follower_photo"]??"");} $displayPhoto=$personPhoto!==""?$personPhoto:$fallbackPhoto;?><div class="matching-person"><img class="photo matching-photo" src="<?=e($displayPhoto)?>" onerror="this.onerror=null;this.src='<?=e($fallbackPhoto)?>'"><div class="matching-name-row"><div class="name matching-name"><?=e((string)$person["name"])?></div><?php if(!empty($person["country"])&&($flagUrl=country_flag_url((string)$person["country"]))):?><img class="matching-flag" src="<?=e($flagUrl)?>" alt="<?=e((string)$person["country"])?> flag"><?php endif;?></div><div class="small matching-bib">BIB <?= (int)$person["bib"] ?></div></div><?php endforeach;?></div></div><?php endforeach; ?></div>'''
          if s.count(old)!=1: raise SystemExit('matching renderer anchor mismatch')
          s=s.replace(old,new,1); p.write_text(s)
          v=Path('VERSION.json'); d=json.loads(v.read_text())
          if d.get('version')!='2.3.3-dev657' or d.get('build')!=3363: raise SystemExit('unexpected version')
          d['version']='2.3.3-dev658'; d['build']=3364; d.setdefault('features',[]).insert(0,'Emcee Random Final Match updated to the current Finalist Couples identity layout: full first names, real flags beside names, large BIBs, photos and responsive five-card grid.')
          v.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          Path('RELEASE-v2.3.3-dev658.md').write_text('# BDC v2.3.3-dev658 — Emcee live matching\n\nBuild 3364\n\nUpdates only Random Final Match / emcee matching cards to the current couple presentation.\n')
          PY
          php -l live-display/feed.php
          git diff --check
      - name: Commit
        run: |
          git config user.name 'BDC Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/apply-emcee-matching-v658.yml
          git add live-display/feed.php VERSION.json RELEASE-v2.3.3-dev658.md
          git commit -m 'Release dev658 update emcee live matching cards'
          git push origin HEAD:develop